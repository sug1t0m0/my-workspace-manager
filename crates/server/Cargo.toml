# wsm-server (JSON API)。仕様は docs/wsm.md、挙動は契約テストが固定する。
[package]
name = "wsm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
# 設定ファイル (config.toml) の解析。値の取り出しは toml::Table を直接歩く
# (serde derive は使わない。`serde` フィーチャは Table / Value 型の提供に要る)。
# preserve_order は tmux_path / herdr_path の出現順 (= 選択 UI の並び順) を
# 保つために必須。
toml = { version = "0.9", default-features = false, features = ["parse", "preserve_order", "serde"] }
wsm-shared = { path = "../shared" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
