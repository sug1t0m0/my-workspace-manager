# 契約テストと UI の回帰テスト (tests/wsm_*.sh) を回す。
# macos ランナーを使うのは、実運用環境 (macOS ホスト) と BSD ツール群を
# 揃えるため。外部コマンドは契約テストのハーネスと UI テストがフェイクするため
# gh 等は不要。
# UI テストは bin/wsm を動かすので zsh と jq (macOS に同梱) を使う。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Contract tests
        run: cargo test --test contract
      # tests/wsm_*.sh をすべて回す。テストを足してもここは直さない
      - name: UI shell tests
        run: sh tests/run.sh
